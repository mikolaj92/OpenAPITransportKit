name: CI

on:
  workflow_dispatch:
    inputs:
      run-android-smoke:
        description: "Run Android SDK smoke build"
        required: false
        default: "false"

jobs:
  test:
    name: Experimental Swift 6.3.2 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3.2"
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Generated client integration tests
        run: swift test --package-path IntegrationTests/GeneratedClient
      - name: Release build
        run: swift build -c release
      - name: Release tests
        run: swift test -c release
      - name: Generated client release integration tests
        run: swift test -c release --package-path IntegrationTests/GeneratedClient

  android-smoke:
    name: Android SDK smoke
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.run-android-smoke == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3.2"
      - name: Swift version
        run: swift --version
      - name: Android SDK instructions
        run: |
          echo "Install the matching Swift SDK for Android with:"
          echo "swift sdk install <artifact-bundle-url> --checksum <checksum>"
          echo "Then run:"
          echo "swift build --swift-sdk aarch64-unknown-linux-android28"
          echo "See https://www.swift.org/documentation/articles/swift-sdk-for-android-getting-started.html"
